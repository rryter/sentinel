<div
  class="p-8 bg-white border-b border-gray-200 flex items-start justify-between gap-8"
>
  <!-- Page Header Content -->
  <div class="flex-1">
    <!-- Breadcrumb -->
    @if (breadcrumbs() && breadcrumbs()!.length > 0) {
      <div class="flex items-center gap-2 mb-3 text-sm">
        @for (breadcrumb of breadcrumbs()!; track $index) {
          @if ($index < breadcrumbs()!.length - 1) {
            <a
              [routerLink]="breadcrumb.route"
              class="text-gray-400 no-underline transition-colors hover:text-indigo-600"
            >
              {{ breadcrumb.label }}
            </a>
            <svg
              class="w-4 h-4 text-gray-400"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
              />
            </svg>
          } @else {
            <span class="text-gray-900 font-medium">{{
              breadcrumb.label
            }}</span>
          }
        }
      </div>
    }

    <!-- Title -->
    <h1
      class="text-4xl font-bold leading-tight mb-2 tracking-tight text-gray-900"
    >
      {{ title() }}
    </h1>

    <!-- Description -->
    @if (description()) {
      <p class="text-base text-gray-500 leading-relaxed max-w-[65ch]">
        {{ description() }}
      </p>
    }
  </div>

  <!-- Page Header Actions -->
  <div class="flex gap-3 shrink-0">
    <ng-content />
  </div>
</div>
