@let projectIdValue = projectId();

<!-- Sidebar Header -->
<div class="p-6 border-b border-white/10">
  <div class="flex items-center gap-3">
    <svg class="w-8 h-8 text-indigo-400 shrink-0" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="24" height="24" rx="4" stroke="currentColor" stroke-width="2"/>
      <path d="M12 16L15 19L20 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="text-xl font-bold text-white tracking-tight">Scoper</span>
  </div>
</div>

<!-- Sidebar Navigation -->
<nav class="flex-1 p-4 px-2 flex flex-col gap-1">
  <a
    routerLink="/projects"
    routerLinkActive="bg-indigo-500/20 text-white shadow-[inset_0_0_0_1px_rgba(79,70,229,0.3)]"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center gap-3 px-4 py-3 text-gray-300 no-underline rounded-md transition-all duration-150 text-sm font-medium hover:bg-white/5 hover:text-white"
  >
    <svg class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
      <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2h-1.528A6 6 0 004 9.528V4z"/>
      <path d="M8 10a4 4 0 00-3.446 6.032l-1.261 1.26a1 1 0 101.414 1.415l1.261-1.261A4 4 0 108 10z"/>
    </svg>
    <span class="whitespace-nowrap">Projects</span>
  </a>

  @if (projectIdValue) {
    <a
      [routerLink]="['/projects', projectId(), 'linting', 'rules']"
      routerLinkActive="bg-indigo-500/20 text-white shadow-[inset_0_0_0_1px_rgba(79,70,229,0.3)]"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-4 py-3 text-gray-300 no-underline rounded-md transition-all duration-150 text-sm font-medium hover:bg-white/5 hover:text-white"
    >
      <svg class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
      </svg>
      <span class="whitespace-nowrap">Rules</span>
    </a>

    <a
      [routerLink]="['/projects', projectId(), 'linting']"
      routerLinkActive="bg-indigo-500/20 text-white shadow-[inset_0_0_0_1px_rgba(79,70,229,0.3)]"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-4 py-3 text-gray-300 no-underline rounded-md transition-all duration-150 text-sm font-medium hover:bg-white/5 hover:text-white"
      aria-current="page"
    >
      <svg class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
      </svg>
      <span class="whitespace-nowrap">Linting</span>
    </a>

    <a
      [routerLink]="['/projects', projectId(), 'builds', 'metrics']"
      routerLinkActive="bg-indigo-500/20 text-white shadow-[inset_0_0_0_1px_rgba(79,70,229,0.3)]"
      class="flex items-center gap-3 px-4 py-3 text-gray-300 no-underline rounded-md transition-all duration-150 text-sm font-medium hover:bg-white/5 hover:text-white"
    >
      <svg class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
      </svg>
      <span class="whitespace-nowrap">Build Metrics</span>
    </a>

    <a
      [routerLink]="['/projects', projectId(), 'settings']"
      routerLinkActive="bg-indigo-500/20 text-white shadow-[inset_0_0_0_1px_rgba(79,70,229,0.3)]"
      class="flex items-center gap-3 px-4 py-3 text-gray-300 no-underline rounded-md transition-all duration-150 text-sm font-medium hover:bg-white/5 hover:text-white"
    >
      <svg class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"/>
      </svg>
      <span class="whitespace-nowrap">Settings</span>
    </a>
  }
</nav>
