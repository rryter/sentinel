<div class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg hover:border-gray-300 transition-colors">
  <div class="flex items-center gap-3">
    <div class="flex-shrink-0">
      <ng-icon
        name="lucideAlertCircle"
        class="w-5 h-5 text-amber-500"
      ></ng-icon>
    </div>
    <div class="flex flex-col">
      <span class="text-sm font-medium text-gray-900">
        {{ formattedRuleName() }}
      </span>
      <span class="text-xs text-gray-500">
        {{ rule() }}
      </span>
    </div>
  </div>
  <div class="flex-shrink-0">
    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-semibold bg-amber-100 text-amber-800">
      {{ count() }}
    </span>
  </div>
</div>
