<div class="min-h-screen flex items-center justify-center p-8">
  <div class="relative w-full max-w-4xl h-[600px] bg-white rounded-lg shadow-2xl overflow-hidden">
    <!-- Split Screen Container -->
    <div class="flex h-full">

      <!-- Left Panel - Already Signed up -->
      <div class="relative w-5/12 bg-gradient-to-br from-blue-600 to-blue-700 text-white flex flex-col items-center justify-center p-12 overflow-visible">
        <div class="diagonal-edge"></div>
        <div class="relative z-10 text-center space-y-6">
          <h1 class="text-3xl font-bold tracking-wide">BoardMe</h1>

          <div class="mt-20">
            <h2 class="text-2xl font-bold mb-5">Already Signed up?</h2>
            <p class="text-sm mb-10 opacity-95 leading-relaxed px-4">
              Log in to your account so you can continue building and<br>
              editing your onboarding flows.
            </p>

            <button
              type="button"
              class="px-14 py-3 border-2 border-white text-white font-bold tracking-wider text-sm rounded hover:bg-white hover:bg-opacity-10 transition-all duration-300"
            >
              LOG IN
            </button>
          </div>
        </div>
      </div>

      <!-- Right Panel - Sign Up Form -->
      <div class="w-7/12 bg-white flex items-center justify-center p-12">
        <div class="w-full max-w-md">
          <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Sign Up for an Account</h2>
            <p class="text-sm text-gray-500">
              Let's get you all set up so you can start creating your<br>
              first onboarding experience.
            </p>
          </div>

          <form class="space-y-4" (submit)="submitForm($event)" novalidate>
            <!-- First Name and Last Name -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">First Name</label>
                <input
                  type="text"
                  placeholder="Your first name"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Last Name</label>
                <input
                  type="text"
                  placeholder="Your last name"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                />
              </div>
            </div>

            <!-- Email -->
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
              <input
                hlmInput
                type="email"
                [field]="loginForm.email"
                placeholder="Enter your email address"
                formControlName="email"
                class="w-full px-4 py-2.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              />
            </div>

            <!-- Password -->
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
              <div class="relative">
                <input
                  type="password"
                  placeholder="Enter a strong password"
                  class="w-full px-4 py-2.5 pr-10 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                />
                <button
                  type="button"
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                >
                  👁️
                </button>
              </div>
            </div>

            <!-- Terms Checkbox -->
            <div class="flex items-center text-sm">
              <input
                type="checkbox"
                id="terms"
                class="mr-2 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
              />
              <label for="terms" class="text-gray-600">
                I accept BoardMe's <a href="#" class="text-blue-600 hover:underline">Terms & Conditions</a>
              </label>
            </div>

            <!-- Sign Up Button -->
            <button
              type="submit"
              [disabled]="!loginForm().valid() || pending()"
              class="w-full py-3 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-300"
            >
              @if (pending()) {
                Please Wait ...
              } @else {
                SIGN UP
              }
            </button>

            <!-- Social Login -->
            <div class="text-center mt-6">
              <p class="text-sm text-gray-500 mb-4">Or sign up using</p>
              <div class="flex justify-center gap-3">
                <button
                  type="button"
                  class="social-icon"
                  aria-label="Sign up with Google"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-red-500">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                  </svg>
                </button>
                <button
                  type="button"
                  class="social-icon"
                  aria-label="Sign up with Facebook"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-blue-600">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                  </svg>
                </button>
                <button
                  type="button"
                  class="social-icon"
                  aria-label="Sign up with Twitter"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-blue-400">
                    <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
